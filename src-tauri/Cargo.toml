[package]
name = "emulation-desktop"
version = "0.5.0"
description = "Native robot motion workspace"
authors = ["ecojust"]
edition = "2021"
default-run = "emulation"

[lib]
name = "emulation_desktop"
path = "src/lib.rs"

[[bin]]
name = "emulation"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-clipboard-manager", "model-cache", "pendant"]
model-cache = ["dep:reqwest", "dep:rustls", "dep:sha2", "dep:bytes", "tokio/fs", "tokio/io-util", "tokio/macros", "tokio/rt", "tokio/time"]

pendant = ["dep:axum", "dep:futures-util", "dep:getrandom", "dep:if-addrs", "dep:tokio-tungstenite", "tokio/net", "tokio/io-util", "tokio/macros", "tokio/rt", "tokio/time"]

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dependencies]
emulation-core = { path = "../crates/robot-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tauri = { version = "2", optional = true, features = ["protocol-asset"] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
sha2 = { version = "0.10", optional = true }
bytes = { version = "1", optional = true }
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "tokio"], optional = true }
futures-util = { version = "0.3", features = ["sink"], optional = true }
getrandom = { version = "0.3", optional = true }
if-addrs = { version = "0.13", optional = true }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"], optional = true }

[[example]]
name = "model-cache-check"
required-features = ["model-cache"]

[[example]]
name = "pendant-check"
required-features = ["pendant"]
