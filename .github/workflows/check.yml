name: Check robot simulation

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Native core and browser reference
    runs-on: ubuntu-latest
    # Expanded real-browser editor and simulation checks run serially on software graphics.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true
      - run: npm ci --no-audit --no-fund
      - name: Verify the pinned model catalog
        run: node scripts/generate-model-catalog.mjs --check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify collision bounds against original robot meshes
        run: node scripts/generate-collision-bounds.mjs --check
      - name: Verify generic chains against pinned URDF fixtures
        run: node scripts/generate-generic-chains.mjs --check
      - name: Check Rust algorithms without desktop system dependencies
        run: cargo test -p emulation-core --release --locked
      - name: Check native job and export policies
        run: cargo test -p emulation-desktop --no-default-features --features model-cache,pendant --release --locked
      - name: Build the native parity-test command
        run: cargo build -p emulation-core --bin core-cli --locked
      - name: Build the native pendant socket test harness
        run: cargo build -p emulation-desktop --example pendant-check --no-default-features --features pendant --locked
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:ui
        env:
          EMULATION_CHROMIUM: /usr/bin/google-chrome
          EMULATION_PENDANT_SERVER: target/debug/examples/pendant-check
      - name: Verify bundled source editor and inline worker
        run: npm run test:ui -- tests/ui/programming.spec.ts tests/ui/generated-programs.spec.ts --output=test-results-source
        env:
          EMULATION_CHROMIUM: /usr/bin/google-chrome
          EMULATION_UI_PREVIEW: "1"
      - name: Verify the bundled grinding worker
        run: npm run test:ui -- tests/ui/grinding.spec.ts --grep "an empty Path" --output=test-results-grinding
        env:
          EMULATION_CHROMIUM: /usr/bin/google-chrome
          EMULATION_UI_PREVIEW: "1"
      - name: Verify the bundled surface geometry worker
        run: npm run test:ui -- tests/ui/surface-production.spec.ts --output=test-results-surface
        env:
          EMULATION_CHROMIUM: /usr/bin/google-chrome
          EMULATION_UI_PREVIEW: "1"
      - name: Upload static application
        uses: actions/upload-artifact@v4
        with:
          name: emulation-web-${{ github.sha }}
          path: dist/
          if-no-files-found: error
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulation-browser-evidence
          path: |
            test-results/
            test-results-source/
            test-results-grinding/
            test-results-surface/
            playwright-report/
            /tmp/emulation-*.png
          if-no-files-found: ignore
