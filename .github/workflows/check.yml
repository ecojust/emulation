name: Check robot simulation

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:ui
        env:
          EMULATION_CHROMIUM: /usr/bin/google-chrome
      - name: Upload static application
        uses: actions/upload-artifact@v4
        with:
          name: emulation-web-${{ github.sha }}
          path: dist/
          if-no-files-found: error
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulation-browser-evidence
          path: |
            test-results/
            playwright-report/
            /tmp/emulation-*.png
          if-no-files-found: ignore
