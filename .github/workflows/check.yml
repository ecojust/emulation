name: Check robot simulation

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Native core and browser reference
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: npm ci --no-audit --no-fund
      - name: Verify collision bounds against original robot meshes
        run: node scripts/generate-collision-bounds.mjs --check
      - name: Check Rust algorithms without desktop system dependencies
        run: cargo test -p emulation-core --release --locked
      - name: Check native job and export policies
        run: cargo test -p emulation-desktop --no-default-features --release --locked
      - name: Build the native parity-test command
        run: cargo build -p emulation-core --bin core-cli --locked
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:ui
        env:
          EMULATION_CHROMIUM: /usr/bin/google-chrome
      - name: Upload static application
        uses: actions/upload-artifact@v4
        with:
          name: emulation-web-${{ github.sha }}
          path: dist/
          if-no-files-found: error
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulation-browser-evidence
          path: |
            test-results/
            playwright-report/
            /tmp/emulation-*.png
          if-no-files-found: ignore
